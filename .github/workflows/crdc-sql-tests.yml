name: CRDC SQL tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "database/**"
      - "CRDC/docs/database/**"
      - "CONTRIBUTING.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/crdc-sql-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "database/**"
      - "CRDC/docs/database/**"
      - "CONTRIBUTING.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/crdc-sql-tests.yml"

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Keep the CLI on the maintained v2 line; setup-cli v3 installs from npm,
          # so this does not resolve "latest" through the unauthenticated GitHub API.
          version: v2.stable

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations to the isolated local database
        run: supabase db reset

      - name: Load guarded synthetic data into the local database
        run: bash supabase/scripts/seed_local.sh

      - name: Run pgTAP tests
        run: supabase test db

      - name: Verify last-admin guard with two concurrent sessions
        run: bash supabase/tests/crdc_last_admin_concurrency.sh
