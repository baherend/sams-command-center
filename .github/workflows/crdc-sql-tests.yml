name: CRDC SQL tests

on:
  push:
    branches: [docs/crdc-data-model-rls]
    paths:
      - "supabase/**"
      - ".github/workflows/crdc-sql-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/crdc-sql-tests.yml"

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and synthetic seed
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db
